<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard · TOS Hub Innovation Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
      :root {
        --primary-blue: #004a8f;
        --accent-teal: #1fb3a8;
        --indigo-galaxy: #0b1c38;
        --text-color: #111b2c;
        --muted-gray: #5c6b7d;
        --white-color: #ffffff;
        --page-bg: #f5f7fb;
        --card-border: #dbe5f4;
        --shadow-light: 0 10px 30px rgba(0, 74, 143, 0.08);
        --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
        --reveal-distance: 28px;
        --glow-duration: 16s;
        --header-height: 84px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Poppins", system-ui, sans-serif;
        background: var(--page-bg);
        color: var(--text-color);
        min-height: 100vh;
      }

      @keyframes gradientShift {
        0% {
          background-position: 0% 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0% 50%;
        }
      }

      @keyframes pulseOutline {
        0% {
          box-shadow: 0 0 0 0 rgba(31, 179, 168, 0.35);
        }
        70% {
          box-shadow: 0 0 0 18px rgba(31, 179, 168, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(31, 179, 168, 0);
        }
      }

      [data-reveal] {
        opacity: 0;
        transform: translateY(var(--reveal-distance));
        transition: opacity 0.7s var(--ease-spring),
          transform 0.7s var(--ease-spring);
        transition-delay: var(--reveal-delay, 0ms);
      }

      [data-reveal].is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      main {
        width: min(1400px, 95vw);
        margin: 2rem auto 4rem;
        padding-top: 1rem;
      }

      .admin-header {
        position: sticky;
        top: 0;
        z-index: 1200;
        background: rgba(255, 255, 255, 0.97);
        backdrop-filter: blur(14px);
        border-bottom: 1px solid rgba(0, 74, 143, 0.12);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.05);
        padding: 0.85rem 0;
        min-height: var(--header-height);
        transition: padding 0.35s var(--ease-spring),
          box-shadow 0.35s ease, transform 0.45s var(--ease-spring);
      }

      .admin-header.is-condensed {
        padding: 0.4rem 0;
        box-shadow: 0 18px 32px rgba(10, 22, 45, 0.18);
      }

      .admin-header.is-hidden {
        transform: translateY(-120%);
      }

      .admin-header .header-inner {
        width: min(1400px, 95vw);
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .logo-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.65rem;
        padding: 0.35rem 0.9rem;
        border-radius: 999px;
        border: 1px solid rgba(0, 74, 143, 0.15);
        background: rgba(255, 255, 255, 0.7);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.08);
        text-decoration: none;
        color: inherit;
        transition: transform 0.3s var(--ease-spring);
      }

      .logo-chip img {
        height: 48px;
        width: auto;
        display: block;
      }

      .logo-chip span {
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--primary-blue);
      }

      .brand-copy {
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
        min-width: 0;
        flex: 1;
      }

      .brand-eyebrow {
        font-size: 0.74rem;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--accent-teal);
        font-weight: 600;
      }

      .brand-title {
        margin: 0;
        font-size: clamp(1.2rem, 3.5vw, 1.9rem);
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--indigo-galaxy);
      }

      .brand-tagline {
        margin: 0;
        font-size: 0.9rem;
        color: var(--muted-gray);
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      .admin-header.is-condensed .brand-title {
        font-size: 1.1rem;
      }

      .admin-header.is-condensed .logo-chip img {
        height: 42px;
      }

      .cta-button {
        background: linear-gradient(135deg, #004a8f 0%, #1fb3a8 100%);
        color: #fff;
        border: none;
        border-radius: 999px;
        padding: 0.7rem 1.8rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        box-shadow: var(--shadow-light);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        position: relative;
        overflow: hidden;
      }

      .cta-button::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: radial-gradient(
          circle at 30% 30%,
          rgba(255, 255, 255, 0.35),
          transparent 55%
        );
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }

      .cta-button:hover {
        transform: translateY(-3px);
        box-shadow: 0 18px 36px rgba(0, 0, 0, 0.15);
      }

      .cta-button:hover::after {
        opacity: 1;
      }

      .header-cta {
        white-space: nowrap;
        animation: pulseOutline 3.5s ease infinite;
      }
      .panel {
        background: #fff;
        border: 1px solid var(--card-border);
        border-radius: 20px;
        padding: clamp(1.5rem, 3vw, 2rem);
        box-shadow: var(--shadow-light);
      }
      /* Login Screen Styles */
      #loginScreen {
        max-width: 450px;
        margin: 4rem auto;
      }
      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }
      .login-header img {
        width: 64px;
        margin-bottom: 1rem;
      }
      .login-header h1 {
        font-size: 1.8rem;
        color: var(--indigo-galaxy);
        margin: 0;
      }
      .input-group {
        margin-bottom: 1rem;
      }
      .input-group label {
        display: block;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--indigo-galaxy);
        margin-bottom: 0.5rem;
      }
      .input-group input {
        width: 100%;
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 0.9rem 1rem;
        font-size: 1rem;
        font-family: inherit;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }
      .input-group input:focus {
        border-color: var(--primary-blue);
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 74, 143, 0.15);
      }
      .login-btn {
        width: 100%;
        border: none;
        border-radius: 12px;
        background: var(--primary-blue);
        color: #fff;
        font-weight: 600;
        padding: 0.95rem 1.25rem;
        margin-top: 1rem;
        cursor: pointer;
        transition: background 0.2s ease;
      }
      .login-btn:hover {
        background: var(--indigo-galaxy);
      }
      .error-message {
        display: none;
        border-radius: 12px;
        padding: 0.85rem 1rem;
        background: rgba(224, 67, 82, 0.08);
        border: 1px solid rgba(224, 67, 82, 0.2);
        color: #ac1020;
        font-size: 0.9rem;
        margin-bottom: 1rem;
      }

      /* Dashboard Shell Styles */
      .dashboard-shell {
        display: none;
      }
      .dashboard-shell.active {
        display: block;
      }
      .dashboard-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 2rem;
      }
      .dashboard-header h1 {
        text-align: left;
        font-size: 2rem;
        color: var(--indigo-galaxy);
        margin: 0;
      }
      .logout-btn {
        background: #eef4fb;
        color: var(--muted-gray);
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 0.7rem 1.5rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .logout-btn:hover {
        background: var(--primary-blue);
        color: white;
        border-color: var(--primary-blue);
      }
      .view-switcher {
        display: flex;
        gap: 0.5rem;
        background-color: #eef4fb;
        padding: 0.5rem;
        border-radius: 14px;
        margin-bottom: 2rem;
      }
      .view-switcher button {
        flex: 1;
        padding: 0.8rem 1rem;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: var(--muted-gray);
        font-weight: 600;
        font-size: 1rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .view-switcher button.active {
        background: var(--white-color);
        color: var(--primary-blue);
        box-shadow: 0 5px 15px rgba(0, 74, 143, 0.1);
      }
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 1.5rem;
        background: var(--white-color);
      }
      .stat-card h4 {
        margin: 0;
        font-size: 0.9rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted-gray);
      }
      .stat-card .value {
        margin-top: 0.5rem;
        font-size: 2.2rem;
        font-weight: 700;
        color: var(--indigo-galaxy);
      }
      .table-controls {
        display: flex;
        justify-content: space-between;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }
      .search-box input {
        min-width: 300px;
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 0.8rem 1rem;
        font-size: 1rem;
        font-family: inherit;
      }
      .table-actions button {
        border: 1px solid var(--card-border);
        border-radius: 12px;
        padding: 0.8rem 1.5rem;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        background: #fff;
        color: var(--primary-blue);
        transition: all 0.2s ease;
      }
      .table-actions button:hover {
        background: #eef4fb;
      }
      .table-wrapper {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.95rem;
        min-width: 1200px;
      }
      th,
      td {
        padding: 1rem 1.25rem;
        text-align: left;
        border-bottom: 1px solid #eef4fb;
      }
      thead {
        background-color: #f8fbff;
      }
      th {
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted-gray);
      }
      tbody tr:hover {
        background-color: #f8fbff;
      }
      .copy-btn {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.25rem;
        vertical-align: middle;
      }
      .copy-btn svg {
        width: 16px;
        height: 16px;
        color: var(--muted-gray);
        transition: color 0.2s;
      }
      .copy-btn:hover svg {
        color: var(--primary-blue);
      }
      .link-icon {
        color: var(--primary-blue);
        text-decoration: none;
        display: inline-block;
        margin-right: 0.5rem;
        transition: color 0.2s;
      }
      .link-icon:hover {
        color: var(--accent-teal);
      }
      .loading,
      .no-data {
        text-align: center;
        padding: 4rem;
        font-size: 1.1rem;
        color: var(--muted-gray);
      }

      @media (max-width: 720px) {
        .admin-header .header-inner {
          flex-direction: column;
          align-items: flex-start;
        }

        .header-cta {
          width: 100%;
          text-align: center;
          animation: none;
        }

        .logo-chip img {
          height: 42px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .admin-header,
        .cta-button,
        [data-reveal] {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="admin-header" aria-label="TOS Hub Admin Header">
      <div class="header-inner">
        <a href="index.html" class="logo-chip" aria-label="TOS Hub Home">
          <img src="images/TOS-Hub-logo.png" alt="TOS Hub Logo" />
          <span>TOS Hub</span>
        </a>
        <div class="brand-copy">
          <span class="brand-eyebrow">Operations</span>
          <h1 class="brand-title">TOS Hub Control Room</h1>
          <p class="brand-tagline">Monitor registrations & submissions</p>
        </div>
        <a href="hackathon.html" class="cta-button header-cta">View Event</a>
      </div>
    </header>
    <main>
      <section class="panel" id="loginScreen" data-reveal>
        <div class="login-header">
          <img src="images/TOS-Hub-logo.png" alt="TOS Hub Logo" />
          <h1>Admin Dashboard</h1>
        </div>
        <div id="loginError" class="error-message"></div>
        <form id="loginForm">
          <div class="input-group">
            <label for="password">Admin Password</label>
            <input id="password" type="password" required />
          </div>
          <button type="submit" class="login-btn">Sign In</button>
        </form>
      </section>

      <section class="dashboard-shell" id="adminDashboard">
        <div class="dashboard-header" data-reveal>
          <h1>Dashboard</h1>
          <button class="logout-btn" id="logoutBtn">Logout</button>
        </div>

        <nav class="view-switcher" data-reveal>
          <button id="viewRegsBtn" class="active">Registrations</button>
          <button id="viewSubsBtn">Project Submissions</button>
        </nav>

        <div class="panel" data-reveal>
          <div class="stats-grid" id="stats-container" data-reveal>
            <!-- Stats will be loaded here by JS -->
          </div>
          <div class="table-controls" data-reveal>
            <div class="search-box">
              <input type="text" id="searchInput" placeholder="Search..." />
            </div>
            <div class="table-actions">
              <button id="refreshBtn">Refresh</button>
              <button id="exportBtn">Export CSV</button>
              <button id="copyEmailsBtn">Copy Emails</button>
            </div>
          </div>
          <div class="table-wrapper" id="data-view-container" data-reveal>
            <!-- Table will be loaded here by JS -->
          </div>
        </div>
      </section>
    </main>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("page-loaded");
        const prefersReducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        );
        const header = document.querySelector(".admin-header");
        let lastScrollY = window.scrollY;

        const updateHeaderState = () => {
          if (!header) {
            return;
          }
          if (window.scrollY > 24) {
            header.classList.add("is-condensed");
          } else {
            header.classList.remove("is-condensed");
          }

          if (window.scrollY > lastScrollY && window.scrollY > 140) {
            header.classList.add("is-hidden");
          } else {
            header.classList.remove("is-hidden");
          }

          lastScrollY = window.scrollY;
        };

        window.addEventListener("scroll", updateHeaderState, { passive: true });
        updateHeaderState();

        const revealTargets = document.querySelectorAll("[data-reveal]");
        const supportsIntersectionObserver = "IntersectionObserver" in window;
        if (prefersReducedMotion.matches || !supportsIntersectionObserver) {
          revealTargets.forEach((el) => el.classList.add("is-visible"));
        } else if (revealTargets.length) {
          const revealObserver = new IntersectionObserver(
            (entries) => {
              entries.forEach((entry) => {
                if (entry.isIntersecting) {
                  entry.target.classList.add("is-visible");
                  revealObserver.unobserve(entry.target);
                }
              });
            },
            { threshold: 0.2, rootMargin: "0px 0px -10% 0px" }
          );

          revealTargets.forEach((el, index) => {
            el.style.setProperty("--reveal-delay", `${(index % 5) * 90}ms`);
            revealObserver.observe(el);
          });
        }

        const decodeConfig = (value) => window.atob(value);
        const SUPABASE_URL = decodeConfig(
          "aHR0cHM6Ly9qbWtycWdudnN4bGVha2FrcXNlZy5zdXBhYmFzZS5jbw=="
        );
        const SUPABASE_ANON_KEY = decodeConfig(
          "ZXlKaGJHY2lPaUpJVXpJMU5pSXNJblI1Y0NJNklrcFhWQ0o5LmV5SnBjM01pT2lKemRYQmhZbUZ6WlNJc0luSmxaaUk2SW1wdGEzSnhaMjUyYzNoc1pXRnJZV3R4YzJWbklpd2ljbTlzWlNJNkltRnViMjRpTENKcFlYUWlPakUzTmpRNE1EQTNPVElzSW1WNGNDSTZNakE0TURNM05qYzVNbjAuUWt5TzA4Qmxud0c1YzBLOTVjdnJyb3J5cnlNcTd2XzloREVzYklTSmJzdw=="
        );
        const supabase = window.supabase.createClient(
          SUPABASE_URL,
          SUPABASE_ANON_KEY
        );
        const ADMIN_PASSWORD = "DavidForTOS";

        let state = {
          currentView: "registrations", // 'registrations' or 'submissions'
          registrations: [],
          submissions: [],
          searchTerm: "",
        };

        // DOM Elements
        const loginScreen = document.getElementById("loginScreen");
        const adminDashboard = document.getElementById("adminDashboard");
        const loginForm = document.getElementById("loginForm");
        const loginError = document.getElementById("loginError");
        const logoutBtn = document.getElementById("logoutBtn");
        const viewRegsBtn = document.getElementById("viewRegsBtn");
        const viewSubsBtn = document.getElementById("viewSubsBtn");
        const statsContainer = document.getElementById("stats-container");
        const dataContainer = document.getElementById("data-view-container");
        const searchInput = document.getElementById("searchInput");
        const refreshBtn = document.getElementById("refreshBtn");
        const exportBtn = document.getElementById("exportBtn");
        const copyEmailsBtn = document.getElementById("copyEmailsBtn");

        // --- AUTHENTICATION ---
        const checkAuth = () => {
          if (sessionStorage.getItem("adminAuth") === "true") {
            loginScreen.style.display = "none";
            adminDashboard.classList.add("active");
            renderView();
          }
        };

        loginForm.addEventListener("submit", (e) => {
          e.preventDefault();
          if (document.getElementById("password").value === ADMIN_PASSWORD) {
            sessionStorage.setItem("adminAuth", "true");
            checkAuth();
          } else {
            loginError.textContent = "Invalid password.";
            loginError.style.display = "block";
          }
        });

        logoutBtn.addEventListener("click", () => {
          sessionStorage.removeItem("adminAuth");
          window.location.reload();
        });

        // --- VIEW SWITCHING ---
        viewRegsBtn.addEventListener("click", () =>
          switchView("registrations")
        );
        viewSubsBtn.addEventListener("click", () => switchView("submissions"));

        function switchView(viewName) {
          state.currentView = viewName;
          viewRegsBtn.classList.toggle("active", viewName === "registrations");
          viewSubsBtn.classList.toggle("active", viewName === "submissions");
          searchInput.value = "";
          state.searchTerm = "";
          searchInput.placeholder =
            viewName === "registrations"
              ? "Search by team, lead, email, idea..."
              : "Search by team, project name...";
          renderView();
        }

        // --- DATA FETCHING ---
        async function fetchData() {
          dataContainer.innerHTML =
            '<div class="loading">Loading data...</div>';
          try {
            const [regs, subs] = await Promise.all([
              supabase
                .from("hackathon_registrations")
                .select("*")
                .order("created_at", { ascending: false }),
              supabase
                .from("hackathon_submissions")
                .select("*")
                .order("created_at", { ascending: false }),
            ]);
            if (regs.error) throw regs.error;
            if (subs.error) throw subs.error;
            state.registrations = regs.data;
            state.submissions = subs.data;
          } catch (err) {
            dataContainer.innerHTML = `<div class="loading">Error: ${err.message}</div>`;
          }
        }

        // --- RENDERING ---
        async function renderView() {
          if (
            state.registrations.length === 0 &&
            state.submissions.length === 0
          ) {
            await fetchData();
          }
          updateStats();
          renderTable();
        }

        function updateStats() {
          if (state.currentView === "registrations") {
            const totalParticipants = state.registrations.reduce(
              (sum, reg) => sum + 1 + (reg.team_members?.length || 0),
              0
            );
            statsContainer.innerHTML = `
            <div class="stat-card"><h4>Total Teams</h4><div class="value">${state.registrations.length}</div></div>
            <div class="stat-card"><h4>Total Participants</h4><div class="value">${totalParticipants}</div></div>
          `;
          } else {
            statsContainer.innerHTML = `
            <div class="stat-card"><h4>Total Submissions</h4><div class="value">${state.submissions.length}</div></div>
          `;
          }
        }

        function renderTable() {
          const isRegs = state.currentView === "registrations";
          const data = isRegs ? state.registrations : state.submissions;

          const filteredData = data.filter((item) => {
            if (!state.searchTerm) return true;
            const term = state.searchTerm.toLowerCase();
            if (isRegs) {
              return (
                item.team_name?.toLowerCase().includes(term) ||
                item.contact_name?.toLowerCase().includes(term) ||
                item.contact_email?.toLowerCase().includes(term) ||
                item.idea_name?.toLowerCase().includes(term)
              );
            } else {
              return (
                item.team_name?.toLowerCase().includes(term) ||
                item.project_name?.toLowerCase().includes(term)
              );
            }
          });

          if (filteredData.length === 0) {
            dataContainer.innerHTML = `<div class="no-data">No ${
              isRegs ? "registrations" : "submissions"
            } found.</div>`;
            return;
          }

          const tableHTML = isRegs
            ? getRegistrationsTable(filteredData)
            : getSubmissionsTable(filteredData);
          dataContainer.innerHTML = tableHTML;
        }

        function getRegistrationsTable(data) {
          const rows = data
            .map(
              (reg) => `
          <tr>
            <td><strong>${reg.team_name}</strong></td>
            <td>
              ${reg.contact_name}
              <button class="copy-btn" title="Copy email" data-email="${
                reg.contact_email
              }">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </button>
              <br><small>${reg.contact_email}</small>
              <br><small>${reg.contact_phone}</small>
              ${reg.contact_linkedin ? `<br><small><a href="${reg.contact_linkedin}" target="_blank" rel="noopener noreferrer">LinkedIn</a></small>` : ''}
            </td>
            <td>${reg.idea_name}<br><small>${reg.idea_description || ''}</small></td>
            <td>
              ${(reg.team_members || []).length > 0 ? `<ul>
                ${(reg.team_members || [])
                  .map((m) => `<li><strong>${m.name}</strong>
                    <button class="copy-btn" title="Copy email" data-email="${m.email}">
                      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                    </button>
                    <br><small>${m.email}</small>
                    <br><small>${m.phone || 'N/A'}</small>
                    ${m.linkedin ? `<br><small><a href="${m.linkedin}" target="_blank" rel="noopener noreferrer">LinkedIn</a></small>` : ''}
                  </li>`)
                  .join("")}
              </ul>` : '<em>No teammates</em>'}
            </td>
            <td>${new Date(reg.created_at).toLocaleString()}</td>
          </tr>
        `
            )
            .join("");

          return `
          <div class="table-wrapper">
            <table>
              <thead><tr><th>Team Name</th><th>Team Lead</th><th>Idea</th><th>Teammates</th><th>Registered On</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
        }

        function getSubmissionsTable(data) {
          const rows = data
            .map(
              (sub) => `
          <tr>
            <td><strong>${sub.team_name}</strong></td>
            <td>
              <strong>${sub.project_name}</strong>
              ${sub.tagline ? `<br><small><em>${sub.tagline}</em></small>` : ''}
            </td>
            <td>
              ${sub.contact_name}
              <button class="copy-btn" title="Copy email" data-email="${sub.contact_email}">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
              </button>
              <br><small>${sub.contact_email}</small>
            </td>
            <td>${sub.selected_sdg || 'N/A'}</td>
            <td style="max-width: 300px; white-space: pre-wrap;">${sub.project_description}</td>
            <td style="max-width: 250px; white-space: pre-wrap;">${sub.team_members || 'N/A'}</td>
            <td style="max-width: 200px; white-space: pre-wrap;">${sub.tech_stack || 'N/A'}</td>
            <td>
              ${sub.live_demo_url ? `<a href="${sub.live_demo_url}" target="_blank" rel="noopener noreferrer" class="link-icon" title="Live Demo">🔗</a>` : '<span style="opacity:0.5">—</span>'}
              ${sub.demo_video_url ? `<a href="${sub.demo_video_url}" target="_blank" rel="noopener noreferrer" class="link-icon" title="Demo Video">🎥</a>` : '<span style="opacity:0.5">—</span>'}
              ${sub.pitch_deck_url ? `<a href="${sub.pitch_deck_url}" target="_blank" rel="noopener noreferrer" class="link-icon" title="Pitch Deck">📄</a>` : '<span style="opacity:0.5">—</span>'}
              ${sub.github_repo_url ? `<a href="${sub.github_repo_url}" target="_blank" rel="noopener noreferrer" class="link-icon" title="GitHub Repo">💻</a>` : '<span style="opacity:0.5">—</span>'}
            </td>
            <td style="max-width: 300px; white-space: pre-wrap;">${sub.ai_usage_disclosure || 'N/A'}</td>
            <td>${new Date(sub.created_at).toLocaleString()}</td>
          </tr>
        `
            )
            .join("");

          return `
          <div class="table-wrapper">
            <table>
              <thead><tr>
                <th>Team Name</th>
                <th>Project Name</th>
                <th>Contact</th>
                <th>SDG</th>
                <th>Description</th>
                <th>Team Members</th>
                <th>Tech Stack</th>
                <th>Links</th>
                <th>AI Usage</th>
                <th>Submitted On</th>
              </tr></thead>
              <tbody>${rows}</tbody>
            </table>
          </div>
        `;
        }

        // --- EVENT HANDLERS ---
        searchInput.addEventListener("input", (e) => {
          state.searchTerm = e.target.value;
          renderTable();
        });

        refreshBtn.addEventListener("click", async () => {
          await fetchData();
          renderTable();
        });

        dataContainer.addEventListener("click", (e) => {
          const copyBtn = e.target.closest(".copy-btn");
          if (copyBtn) {
            const email = copyBtn.dataset.email;
            navigator.clipboard.writeText(email).then(() => {
              const originalIcon = copyBtn.innerHTML;
              copyBtn.innerHTML = "✅";
              setTimeout(() => {
                copyBtn.innerHTML = originalIcon;
              }, 1500);
            });
          }
        });

        exportBtn.addEventListener("click", () => {
          const isRegs = state.currentView === "registrations";
          const data = isRegs ? state.registrations : state.submissions;
          if (!data.length) return alert("No data to export.");

          const headers = isRegs
            ? [
                "Team Name",
                "Lead Name",
                "Lead Email",
                "Lead Phone",
                "Lead LinkedIn",
                "Idea",
                "Description",
                "Teammate 1 Name",
                "Teammate 1 Email",
                "Teammate 1 Phone",
                "Teammate 1 LinkedIn",
                "Teammate 2 Name",
                "Teammate 2 Email",
                "Teammate 2 Phone",
                "Teammate 2 LinkedIn",
                "Teammate 3 Name",
                "Teammate 3 Email",
                "Teammate 3 Phone",
                "Teammate 3 LinkedIn",
                "Timestamp",
              ]
            : [
                "Team Name",
                "Project Name",
                "Tagline",
                "Contact Name",
                "Contact Email",
                "SDG",
                "Description",
                "Team Members",
                "Tech Stack",
                "Live Demo URL",
                "Demo Video URL",
                "Pitch Deck URL",
                "GitHub Repo URL",
                "AI Usage Disclosure",
                "Timestamp",
              ];

          let csvContent = headers.join(",") + "\n";

          data.forEach((item) => {
            let row;
            if (isRegs) {
              const members = item.team_members || [];
              row = [
                item.team_name,
                item.contact_name,
                item.contact_email,
                item.contact_phone,
                item.contact_linkedin,
                item.idea_name,
                item.idea_description,
                members[0]?.name || '',
                members[0]?.email || '',
                members[0]?.phone || '',
                members[0]?.linkedin || '',
                members[1]?.name || '',
                members[1]?.email || '',
                members[1]?.phone || '',
                members[1]?.linkedin || '',
                members[2]?.name || '',
                members[2]?.email || '',
                members[2]?.phone || '',
                members[2]?.linkedin || '',
                new Date(item.created_at).toLocaleString(),
              ];
            } else {
              row = [
                item.team_name,
                item.project_name,
                item.tagline,
                item.contact_name,
                item.contact_email,
                item.selected_sdg,
                item.project_description,
                item.team_members,
                item.tech_stack,
                item.live_demo_url,
                item.demo_video_url,
                item.pitch_deck_url,
                item.github_repo_url,
                item.ai_usage_disclosure,
                new Date(item.created_at).toLocaleString(),
              ];
            }
            csvContent +=
              row
                .map((val) => `"${(val || "").toString().replace(/"/g, '""')}"`)
                .join(",") + "\n";
          });

          const blob = new Blob([csvContent], {
            type: "text/csv;charset=utf-8;",
          });
          const link = document.createElement("a");
          const url = URL.createObjectURL(blob);
          link.setAttribute("href", url);
          link.setAttribute(
            "download",
            `${state.currentView}_export_${
              new Date().toISOString().split("T")[0]
            }.csv`
          );
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        });

        if (copyEmailsBtn) {
          copyEmailsBtn.addEventListener("click", () => {
            const isRegs = state.currentView === "registrations";
            const data = isRegs ? state.registrations : state.submissions;
            if (!data.length) {
              alert("No emails to copy yet.");
              return;
            }

            const emailMap = new Map();
            const addEmail = (raw) => {
              const trimmed = (raw || "").trim();
              if (!trimmed) return;
              const key = trimmed.toLowerCase();
              if (!emailMap.has(key)) {
                emailMap.set(key, trimmed);
              }
            };

            data.forEach((item) => {
              addEmail(item.contact_email);
              if (isRegs) {
                (item.team_members || []).forEach((member) =>
                  addEmail(member.email)
                );
              }
            });

            if (emailMap.size === 0) {
              alert("No valid email addresses found.");
              return;
            }

            const emailsString = Array.from(emailMap.values()).join("; ");

            copyEmailsBtn.disabled = true;
            const originalText = copyEmailsBtn.textContent;
            navigator.clipboard
              .writeText(emailsString)
              .then(() => {
                copyEmailsBtn.textContent = "Emails Copied!";
                setTimeout(() => {
                  copyEmailsBtn.disabled = false;
                  copyEmailsBtn.textContent = originalText;
                }, 1800);
              })
              .catch(() => {
                copyEmailsBtn.disabled = false;
                copyEmailsBtn.textContent = originalText;
                alert("Unable to copy emails. Please try again.");
              });
          });
        }

        // Initial Load
        checkAuth();
      });
    </script>
  </body>
</html>
